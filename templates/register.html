
<head>
<link rel="stylesheet" href="register.css">
</head>
<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header text-center bg-primary text-white">
                    <h2>Create Your BlockPay Account</h2>
                </div>

                <div class="card-body">

                    <form action="/register" method="POST">

                        <!-- Full Name -->
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input
                                type="text"
                                class="form-control"
                                name="fullname"
                                placeholder="Enter your full name"
                                required>
                        </div>

                        <!-- Mobile Number -->
                        <div class="mb-3">
                            <label class="form-label">Mobile Number</label>
                            <input
                                type="tel"
                                class="form-control"
                                name="mobile"
                                placeholder="Enter mobile number"
                                maxlength="10"
                                pattern="[0-9]{10}"
                                required>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input
                                type="email"
                                class="form-control"
                                name="email"
                                placeholder="Enter email"
                                required>
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input
                                type="password"
                                class="form-control"
                                name="password"
                                placeholder="Create password"
                                required>
                        </div>

                        <!-- Confirm Password -->
                        <div class="mb-3">
                            <label class="form-label">Confirm Password</label>
                            <input
                                type="password"
                                class="form-control"
                                name="confirm_password"
                                placeholder="Confirm password"
                                required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Create UPI PIN</label>
                            <input type="password"
                                name="upi_pin"
                                maxlength="6"
                                minlength="4"
                                pattern="[0-9]{4,6}"
                                placeholder="Enter 4 or 6 digit PIN"
                                required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Confirm UPI PIN</label>
                            <input type="password"
                                name="confirm_upi_pin"
                                maxlength="6"
                                minlength="4"
                                pattern="[0-9]{4,6}"
                                placeholder="Confirm UPI PIN"
                                required>
                        </div>
                        <!-- Terms -->
                        <div class="form-check mb-3">
                            <input
                                class="form-check-input"
                                type="checkbox"
                                required>

                            <label class="form-check-label">
                                I agree to the Terms & Conditions
                            </label>
                        </div>

                        <!-- Submit Button -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-success">
                                Register
                            </button>
                        </div>

                    </form>

                    <hr>

                    <div class="text-center">
                        Already have an account?

                        <a href="login.html">
                            Login
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
