<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlockPay - Login & Register</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0d6efd,#6610f2);
    padding:20px;
}

.container{
    width:100%;
    max-width:1100px;
}

.box{
    display:flex;
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.left-panel{
    width:40%;
    background:#0d6efd;
    color:white;
    padding:50px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.left-panel h1{
    margin-bottom:15px;
    font-size:36px;
}

.left-panel p{
    margin-bottom:30px;
    line-height:1.7;
}

.left-panel button{
    width:180px;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

.left-panel button:hover{
    transform:scale(1.05);
}

.right-panel{
    width:60%;
    padding:50px;
}

.right-panel h2{
    text-align:center;
    margin-bottom:25px;
    color:#0d6efd;
}

form{
    display:flex;
    flex-direction:column;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:18px;
    border:1px solid #ccc;
    border-radius:8px;
    outline:none;
    font-size:15px;
}

input:focus{
    border-color:#0d6efd;
}

form button{
    padding:14px;
    border:none;
    border-radius:8px;
    background:#0d6efd;
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

form button:hover{
    background:#084298;
}

.flash{
    margin-bottom:20px;
}

.flash p{
    background:#ffe5e5;
    color:#d00000;
    padding:12px;
    border-radius:8px;
    margin-bottom:10px;
}

@media(max-width:768px){

.box{
    flex-direction:column;
}

.left-panel,
.right-panel{
    width:100%;
}

.left-panel{
    padding:40px 25px;
}

.right-panel{
    padding:35px 25px;
}

.left-panel h1{
    font-size:30px;
}

}
    </style>
</head>
<body>

<div class="container">

    <div class="box">

        <div class="left-panel">
            <h1>Welcome to BlockPay</h1>

            <p>
                Secure Blockchain Payment System
            </p>

            <button id="showRegister">
                Register
            </button>

            <button id="showLogin">
                Login
            </button>

        </div>

        <div class="right-panel">

            <!-- Flash Messages -->
            {% with messages = get_flashed_messages() %}
            {% if messages %}
            <div class="flash">

                {% for message in messages %}
                <p>{{ message }}</p>
                {% endfor %}

            </div>
            {% endif %}
            {% endwith %}

            <!-- Login Form -->

            <form id="loginForm" action="{{ url_for('login') }}" method="POST">

                <h2>Login</h2>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter Username"
                    required>

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <!-- Register Form -->

            <form
                id="registerForm"
                action="{{ url_for('register') }}"
                method="POST"
                style="display:none;"
            >

                <h2>Create Account</h2>

                <input
                    type="text"
                    name="fullname"
                    placeholder="Full Name"
                    required
                >

                <input
                    type="text"
                    name="mobile"
                    placeholder="Mobile Number"
                    maxlength="10"
                    required
                >

                <input
                    type="text"
                    name="username"
                    placeholder="Username (@alex)"
                    required>

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                >

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm Password"
                    required
                >
                <input type="password"
                    name="upi_pin"
                    maxlength="6"
                    minlength="4"
                    pattern="[0-9]{4,6}"
                    placeholder="(upi pin) Enter 4 or 6 digit PIN"
                    required>

                <input type="password"
                    name="confirm_upi_pin"
                    maxlength="6"
                    minlength="4"
                    pattern="[0-9]{4,6}"
                    placeholder="Confirm UPI PIN"
                    required>
                    
                <button type="submit">
                    Register
                </button>

            </form>

        </div>

    </div>

</div>

<script>

const loginForm=document.getElementById("loginForm");
const registerForm=document.getElementById("registerForm");

document.getElementById("showRegister").onclick=function(){

loginForm.style.display="none";
registerForm.style.display="block";

}

document.getElementById("showLogin").onclick=function(){

registerForm.style.display="none";
loginForm.style.display="block";

}

</script>

</body>
</html>
